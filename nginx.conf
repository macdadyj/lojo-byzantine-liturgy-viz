# Cloud Run sends traffic to 8080. This file replaces the image's default
# server (port 80) via /etc/nginx/conf.d/default.conf.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    autoindex off;
    server_tokens off;

    # The Vite build uses base "./", so the root URL resolves hashed files
    # under /assets/. Those names change when the content changes.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
